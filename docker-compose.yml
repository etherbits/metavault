services:
  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    entrypoint: []
    command: ["sh", "-lc", "mkdir -p data && bun --hot index.ts"]
    ports:
      - "3435:3435"
    volumes:
      - ./packages/server:/app/packages/server
    environment:
      DATABASE_URL: sqlite:///app/packages/server/data/db.sqlite
      JWT_SECRET: "dev-secret-change-me"
      PORT: "3435"
      CLIENT_ORIGIN: "http://localhost:3534"

  web-client:
    build:
      context: .
      dockerfile: packages/web-client/Dockerfile
    ports:
      - "3534:3534"
    volumes:
      - ./packages/web-client:/app/packages/web-client
      - ./packages/server:/app/packages/server:ro
    environment:
      VITE_API_URL: "http://localhost:3435/"
    depends_on:
      - server

  info-web:
    image: nginx:alpine
    entrypoint: ["nginx", "-g", "daemon off;"]
    ports:
      - "3536:80"
    volumes:
      - ./packages/info-web/src:/usr/share/nginx/html:ro
      - ./packages/info-web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
