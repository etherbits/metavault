services:
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    command: ["sh", "-lc", "mkdir -p data && bun --hot index.ts"]
    ports:
      - "3435:3435"
    volumes:
      - ./packages/server:/app/packages/server
    environment:
      DATABASE_URL: sqlite:///app/packages/server/data/db.sqlite
      PORT: "3435"
      CLIENT_ORIGIN: "http://localhost:3534"
      EMAIL_HOST: "mailhog"
      EMAIL_PORT: "1025"
    
    depends_on:
      - mailhog

  web-client:
    build:
      context: .
      dockerfile: packages/web-client/Dockerfile
    ports:
      - "3534:3534"
    volumes:
      - ./packages/web-client:/app/packages/web-client
    environment:
      VITE_API_URL: "http://localhost:3435/"
    depends_on:
      - server
