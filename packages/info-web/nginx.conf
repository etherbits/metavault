server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /poster {
        return 301 /poster/;
    }

    location = /info {
        return 301 /info/;
    }

    location /info/ {
        rewrite ^/info/(.*)$ /$1 break;
        try_files $uri $uri/ $uri/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
